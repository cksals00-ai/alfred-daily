# 10:00 KST 호스트 파이프라인 신선도 체크 — Claude 예약 대신 무료로 돈다.
# GS 대시보드(Daily Booking·RM FCST·경쟁사 분석)와 경쟁사 크롤러의 마지막 커밋 시각만 본다.
# 이상이면 이 저장소에 이슈를 연다(같은 날 중복 생성 안 함).
name: Host pipeline freshness (10:00 KST)

on:
  schedule:
    - cron: '0 1 * * *'    # UTC 01:00 = KST 10:00
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: freshness-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 신선도 판정
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/freshness_check.py
      - name: 이상 시 이슈 생성
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="⚠️ 호스트 파이프라인 멈춤 의심 $(TZ=Asia/Seoul date +%m/%d)"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "오늘 이슈 이미 있음 — 생략"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/freshness_report.md
          fi
