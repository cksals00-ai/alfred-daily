# GitHub Pages 배포 — app/public 만 올린다 (원본 구조 불변, 인수인계 문서 2절 B안)
# index.html 이 없으므로 배포 단계에서 dashboard.html 을 복사해 넣는다.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  # 데이터 워크플로가 GITHUB_TOKEN 으로 푸시하면 push 트리거가 안 걸린다(GitHub 재귀 방지).
  # 8/23~28 실측: 스케줄 daily-news 푸시 뒤 push 배포가 한 번도 안 돌았고, 로컬 예약의
  # 별도 푸시가 공백을 가려왔다. 그래서 완료 이벤트로 직접 잇는다 (2026-08-29).
  workflow_run:
    workflows:
      - "Daily news (07:00 KST)"
      - "GS daily (09:00 KST)"
      - "Weekly keyword radar (Sun 07:20 KST)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy dashboard.html to index.html
        run: cp app/public/dashboard.html app/public/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/public
      - id: deployment
        uses: actions/deploy-pages@v4
