# GitHub Pages 배포 — app/public 만 올린다 (원본 구조 불변, 인수인계 문서 2절 B안)
# index.html 이 없으므로 배포 단계에서 dashboard.html 을 복사해 넣는다.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy dashboard.html to index.html
        run: cp app/public/dashboard.html app/public/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/public
      - id: deployment
        uses: actions/deploy-pages@v4
