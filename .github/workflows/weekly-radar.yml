# 주일(일요일) 07:20 KST — 주간 키워드 레이더 갱신
# 히그스필드 예약작업 프롬프트 안에만 있다가 8/16 갱신 후 함께 사라진 로직을,
# 2026-08-24 에 tools/crawler/radar.py 로 레포에 넣고 여기서 돌린다.
# 시크릿: 레포 Settings → Secrets and variables → Actions 의 NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
name: Weekly keyword radar (Sun 07:20 KST)

on:
  schedule:
    - cron: '20 22 * * 6'   # UTC 토 22:20 = KST 일 07:20
  workflow_dispatch:
    inputs:
      sunday:
        description: '기준 주의 일요일 (YYYY-MM-DD). 비우면 가장 최근에 끝난 주'
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-radar

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 레이더 수집 · TREND_PLAN 갱신
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TZ: Asia/Seoul
        # 파이프로 자르면 SIGPIPE 로 죽어 갱신 단계가 안 돈다. tee 만 쓴다.
        run: python3 tools/crawler/radar.py ${{ inputs.sunday }} 2>&1 | tee /tmp/radar.log
      - name: 커밋 · 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "주간 키워드 레이더 갱신 ($(TZ=Asia/Seoul date +%m/%d))"
            git push
          fi
