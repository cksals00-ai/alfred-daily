<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>롱블랙 데일리 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* 창업 */
    --series-2: #008300; /* 커리어 */
    --series-3: #e87ba4; /* 브랜딩 */
    --series-6: #eb6834; /* 뉴스 액센트 */
    --series-5: #1baf7a; /* GS 액센트 */
    --series-7: #4a3aa7; /* 뉴스 인사이트 액센트 */
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #008300;
      --series-3: #d55181;
      --series-6: #d95926;
      --series-5: #199e70;
      --series-7: #9085e9;
      --chip-bg: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #008300;
    --series-3: #d55181;
    --series-6: #d95926;
    --series-5: #199e70;
      --series-7: #9085e9;
    --chip-bg: #262624;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px 60px;
    max-width: 860px;
    margin: 0 auto;
  }
  header { margin-bottom: 20px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
  .theme-toggle {
    float: right; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 8px; padding: 4px 10px;
    font-size: 0.78rem; cursor: pointer;
  }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .tile .label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
  .tile .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .tile .sub { font-size: 0.72rem; color: var(--text-secondary); }

  /* aggregate perspective bars */
  .agg {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }
  .agg h2 { font-size: 0.9rem; margin-bottom: 4px; }
  .agg .desc { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 42px; align-items: center; gap: 10px; margin: 8px 0; }
  .bar-row .name { font-size: 0.8rem; color: var(--text-secondary); }
  .bar-track { height: 14px; background: var(--chip-bg); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .bar-val { font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

  /* tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 10px; padding: 10px 12px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }

  /* news day cards */
  .issue-chips { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .issue-chip { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5; display: flex; gap: 6px; }
  .issue-chip::before { content: "■"; font-size: 0.55rem; color: var(--series-6, #eb6834); margin-top: 4px; }
  .news-full { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.7; white-space: pre-wrap; padding-top: 12px; }

  /* weekly brief (pinned) */
  .brief {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--series-1);
    border-radius: 14px; padding: 20px; margin-bottom: 18px;
  }
  .brief .b-kicker { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--series-1); font-weight: 700; }
  .brief h2 { font-size: 1.05rem; margin: 4px 0 2px; }
  .brief .b-period { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .brief h3 { font-size: 0.8rem; margin: 14px 0 6px; color: var(--text-primary); letter-spacing: 0.01em; }
  .brief p { font-size: 0.86rem; color: var(--text-secondary); margin-bottom: 6px; }
  .brief ul { padding-left: 18px; }
  .brief li { font-size: 0.85rem; color: var(--text-secondary); margin: 5px 0; }
  .brief li strong { color: var(--text-primary); font-weight: 600; }
  .brief .todo { list-style: none; padding-left: 2px; }
  .brief .todo li { display: flex; gap: 8px; align-items: flex-start; }
  .brief .todo input { margin-top: 4px; accent-color: var(--series-1); }
  .verse {
    margin-top: 14px; background: var(--chip-bg); border-radius: 10px; padding: 12px 14px;
  }
  .verse .v-label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 4px; }
  .verse .v-text { font-size: 0.9rem; line-height: 1.7; color: var(--text-primary); }
  .verse .v-ref { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; text-align: right; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .filters .flabel { font-size: 0.75rem; color: var(--muted); margin-right: 2px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 999px; padding: 5px 12px;
    font-size: 0.78rem; cursor: pointer; transition: all .15s;
  }
  .chip.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  /* week groups */
  details.week { border: none; margin-bottom: 14px; }
  details.week > summary {
    padding: 10px 4px; font-size: 0.85rem; font-weight: 700; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
  }
  details.week > summary::before { content: "▸"; font-size: 0.75rem; color: var(--muted); transition: transform .15s; }
  details.week[open] > summary::before { transform: rotate(90deg); }
  details.week > summary .wk-count { font-size: 0.72rem; font-weight: 500; color: var(--muted); }
  details.week > summary .wk-year {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    background: var(--gridline); border-radius: 4px; padding: 1px 5px; margin-left: 2px;
  }
  details.week > summary .wk-now {
    font-size: 0.66rem; font-weight: 600; color: var(--page); background: var(--series-1);
    border-radius: 999px; padding: 2px 8px;
  }

  /* note cards (collapsed by default) */
  details.ncard {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 10px; overflow: hidden;
  }
  details.ncard > summary {
    cursor: pointer; list-style: none; padding: 14px 16px !important;
    display: block !important;
  }
  details.ncard > summary::before { content: none !important; }
  details.ncard > summary::-webkit-details-marker { display: none; }
  details.ncard { border-top: 1px solid var(--border); }
  details.week > summary { display: flex !important; padding: 10px 4px !important; }
  details.week { border-top: none; }
  .nc-meta { font-size: 0.7rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nc-meta .nc-scores { display: inline-flex; gap: 6px; margin-left: auto; }
  .nc-meta .nc-s { display: inline-flex; align-items: center; gap: 3px; font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); }
  .nc-title { font-size: 0.95rem; font-weight: 700; line-height: 1.45; margin: 5px 0 3px; color: var(--text-primary); }
  .nc-sum {
    font-size: 0.8rem; color: var(--text-secondary); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  details.ncard[open] .nc-sum { display: none; }
  .nc-open-hint { font-size: 0.68rem; color: var(--muted); margin-top: 6px; }
  details.ncard[open] .nc-open-hint { display: none; }
  .ncard-body { padding: 0 16px 16px; border-top: 1px solid var(--grid); }
  .card .meta { font-size: 0.72rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .card h3 { font-size: 1.05rem; margin: 6px 0 2px; line-height: 1.4; }
  .ncard-body .subject { font-size: 0.8rem; color: var(--text-secondary); margin: 12px 0 10px; }
  .ncard-body .summary { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 14px; }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .score {
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
  }
  .score .sname { font-size: 0.68rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .score .sval { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score .strack { height: 6px; background: var(--chip-bg); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .score .sfill { height: 100%; border-radius: 0 3px 3px 0; }

  details { border-top: 1px solid var(--grid); }
  details summary {
    cursor: pointer; padding: 10px 0; font-size: 0.82rem; font-weight: 600;
    color: var(--text-secondary); list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details summary::before { content: "▸"; font-size: 0.7rem; color: var(--muted); transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details .body { padding: 0 0 12px; font-size: 0.85rem; }
  details ul { padding-left: 18px; }
  details li { margin: 5px 0; color: var(--text-secondary); }
  details li strong { color: var(--text-primary); font-weight: 600; }
  .full-summary p { color: var(--text-secondary); margin-bottom: 10px; text-align: justify; }
  .full-summary p:last-child { margin-bottom: 0; }
  blockquote {
    border-left: 3px solid var(--baseline); padding: 2px 0 2px 12px;
    margin: 8px 0; color: var(--text-secondary); font-size: 0.84rem; font-style: italic;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { background: var(--chip-bg); color: var(--text-secondary); border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; }
  .card a.link { font-size: 0.75rem; color: var(--series-1); text-decoration: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.85rem; }
  footer { margin-top: 24px; font-size: 0.72rem; color: var(--muted); text-align: center; }

  @media (max-width: 560px) {
    .tiles { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .tile { padding: 10px 12px; }
    .tile .value { font-size: 1.2rem; }
    .scores { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 90px 1fr 38px; }
  }

  /* ── 뉴스 인사이트 ─────────────────────────────── */
  .quota { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .quota-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 8px; }
  .quota-row { display: grid; grid-template-columns: 1fr 70px auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .q-name { font-size: 0.75rem; color: var(--text-primary); }
  .q-note { display: block; font-size: 0.66rem; color: var(--text-secondary); }
  .q-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .q-bar span { display: block; height: 100%; background: var(--series-7); border-radius: 3px; }
  .q-num { font-size: 0.7rem; color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .q-num em { font-style: normal; font-weight: 700; color: var(--series-5); margin-left: 4px; }
  .quota-foot { font-size: 0.68rem; color: var(--text-secondary); margin-top: 6px; }

  .trend-box { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .trend-head h3 { font-size: 0.95rem; margin: 0; }
  .trend-when { font-size: 0.68rem; color: var(--text-secondary); }
  .trend-pending { font-size: 0.76rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
  .pending-badge { display: inline-block; font-size: 0.62rem; font-weight: 700; color: var(--page); background: var(--series-7); border-radius: 999px; padding: 2px 8px; margin-right: 6px; vertical-align: 1px; }
  .trend-plan { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; padding: 6px 0; border-top: 1px dashed var(--border); }
  .tp-name { font-size: 0.74rem; font-weight: 600; color: var(--text-primary); }
  .tp-kw { display: flex; flex-wrap: wrap; gap: 4px; }
  .kw { font-size: 0.68rem; color: var(--text-secondary); background: var(--page); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }
  .trend-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 8px; align-items: center; padding: 5px 0; }
  .tr-name { font-size: 0.74rem; font-weight: 600; }
  .tr-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .tr-bar span { display: block; height: 100%; background: var(--series-7); border-radius: 4px; }
  .tr-num { font-size: 0.72rem; font-variant-numeric: tabular-nums; color: var(--text-secondary); white-space: nowrap; }
  .tr-num em { font-style: normal; font-weight: 700; margin-left: 5px; }
  .tr-num em.up { color: var(--series-5); }
  .tr-num em.down { color: var(--series-6); }

  .src-list { margin: 0; padding-left: 18px; }
  .src-list li { margin-bottom: 7px; }
  .src-list a { color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--border); }
  .src-list a:hover { border-bottom-color: var(--series-7); color: var(--series-7); }
  .src-list .press { display: inline-block; font-size: 0.66rem; color: var(--text-secondary); margin-left: 6px; }

  /* ── 키워드 레이더 ─────────────────────────────── */
  .tg-name { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text-secondary); margin: 14px 0 2px; }
  .kw-det > summary { list-style: none; cursor: pointer; }
  .kw-det > summary::-webkit-details-marker { display: none; }
  .kw-det > summary::marker { content: ""; }
  .kw-det[open] > summary .tr-name { color: var(--series-7); }
  .kw-body { padding: 0 0 8px 4px; }
  .kw-empty { font-size: 0.7rem; color: var(--text-secondary); padding: 2px 0 4px; }
  .mover { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.74rem; margin-bottom: 6px; }
  .mover strong { font-weight: 600; }
  .mover em { font-style: normal; font-weight: 700; margin-left: 3px; }
  .mover em.up { color: var(--series-5); }
  .mover em.down { color: var(--series-6); }
  .mv-tag { font-size: 0.62rem; font-weight: 700; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; margin-right: 7px; }
  .trend-note { font-size: 0.68rem; color: var(--text-secondary); margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 9px; line-height: 1.65; }
  .trend-note em { font-style: normal; font-weight: 700; color: var(--text-primary); }

  /* ── 커피챗 댓글 초안 ───────────────────────────── */
  .cchat > summary { color: var(--series-3); }
  .cc-text { white-space: pre-line; font-size: 0.82rem; line-height: 1.8; color: var(--text-primary);
             background: var(--chip-bg); border-left: 3px solid var(--series-3);
             border-radius: 0 6px 6px 0; padding: 12px 14px; }
  .cc-copy { margin-top: 9px; font: inherit; font-size: 0.72rem; font-weight: 600;
             color: var(--text-primary); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 999px;
             padding: 6px 15px; cursor: pointer; }
  .cc-copy:active { background: var(--chip-bg); }

  /* ── GS 실적 시각화 ─────────────────────────────── */
  :root { --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
          --series-8: #e34948; --dv-pos: #2a78d6; --dv-neg: #e34948; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { --series-8: #e66767; --dv-pos: #3987e5; --dv-neg: #e66767; }
  }
  :root[data-theme="dark"] { --series-8: #e66767; --dv-pos: #3987e5; --dv-neg: #e66767; }

  #gs-perf { margin-bottom: 22px; }
  .perf-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin: 4px 0 8px; }
  .perf-head h3 { font-size: 0.98rem; margin: 0; }
  .perf-when { font-size: 0.68rem; color: var(--text-secondary); }
  .perf-lede { font-size: 0.79rem; line-height: 1.75; color: var(--text-secondary);
               border-left: 3px solid var(--series-5); background: var(--surface-1);
               border-radius: 0 8px 8px 0; padding: 11px 14px; margin-bottom: 16px; }
  .perf-lede b { color: var(--text-primary); }
  .perf-lede b.up, .mb-nums .up, .dv-val.pos { color: var(--dv-pos); }
  .perf-lede b.down, .mb-nums .down, .dv-val.neg { color: var(--dv-neg); }

  .perf-sec { background: var(--surface-1); border: 1px solid var(--border);
              border-radius: 10px; padding: 14px 14px 12px; margin-bottom: 12px; }
  .perf-sec h4 { font-size: 0.82rem; margin: 0 0 12px; display: flex; gap: 8px;
                 align-items: baseline; flex-wrap: wrap; }
  .perf-sec h4 span { font-weight: 400; font-size: 0.68rem; color: var(--text-secondary); }
  .perf-note { font-size: 0.67rem; color: var(--text-secondary); line-height: 1.7;
               margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .perf-note b { color: var(--text-primary); }
  .perf-note i { display: inline-block; width: 9px; height: 9px; vertical-align: -1px; }
  .lg-fcst { border-left: 2px solid var(--text-primary); height: 10px !important; width: 2px !important; }
  .lg-bud { border-left: 2px dashed var(--muted); height: 10px !important; width: 2px !important; }
  .perf-more > summary { font-size: 0.7rem; color: var(--text-secondary); cursor: pointer;
                         padding: 7px 0 4px; }

  /* 월별 bullet */
  .mb-row { margin-bottom: 14px; }
  .mb-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
  .mb-name { font-size: 0.8rem; font-weight: 700; min-width: 30px; }
  .mb-ach { font-size: 1.02rem; font-weight: 700; }
  .mb-ach .u { font-size: 0.66rem; font-weight: 600; opacity: 0.55; margin-left: 1px; }
  .mb-badge { margin-left: auto; font-size: 0.63rem; font-weight: 700; border: 1px solid;
              border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .mb-track { position: relative; height: 9px; background: var(--chip-bg);
              border-radius: 4px; overflow: visible; }
  .mb-fill { height: 100%; background: var(--series-5); border-radius: 4px; }
  .mb-tick { position: absolute; top: -3px; height: 15px; width: 2px; }
  .mb-fcst { background: var(--text-primary); }
  .mb-bud { background: repeating-linear-gradient(var(--muted) 0 3px, transparent 3px 5px); }
  .mb-nums { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.68rem;
             color: var(--text-secondary); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .mb-nums b { color: var(--text-primary); }

  /* SVG 차트 */
  .vz-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.7rem;
               color: var(--text-secondary); margin-bottom: 6px; }
  .vz-lg i, .vz-tip i { display: inline-block; width: 9px; height: 9px; border-radius: 2px;
                        margin-right: 5px; vertical-align: -1px; }
  .vz-wrap { position: relative; }

function weekStartOf(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay()); // 일요일 시작
  return d;
}
function fmtMD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
function fmtWeek(start, end) {
  const y = start.getFullYear();
  const cur = new Date().getFullYear();
  return `${fmtMD(start)} – ${fmtMD(end)}${y !== cur ? ` <span class="wk-year">${y}</span>` : ""}`;
}

function copyComment(id, btn) {
  const t = document.getElementById("cc-" + id).innerText;
  const done = () => { btn.textContent = "복사됨 \u2713"; setTimeout(() => btn.textContent = "댓글 복사", 1800); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => { btn.textContent = "길게 눌러 복사하세요"; });
  } else { btn.textContent = "길게 눌러 복사하세요"; }
}

  return `
    <details class="ncard" ${opt.open ? "open" : ""}>
      <summary>
        <div class="nc-meta"><span>${n.date}</span><span>#${n.id}</span><span class="nc-scores">${miniScores}</span></div>

function render(filter = "all") {
  const cards = document.getElementById("cards");
  const shown = (filter === "all" ? NOTES : NOTES.filter(n => n.scores[filter] >= 4.0))
    .slice().sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("empty").style.display = shown.length ? "none" : "block";

  // 주간(일요일 시작) 그룹핑
  const groups = new Map();
  shown.forEach(n => {
    const ws = weekStartOf(n.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, notes: [] });
    groups.get(key).notes.push(n);
  });

  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const sorted = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));

  cards.innerHTML = sorted.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""}>
        <summary>${fmtWeek(g.start, end)} <span class="wk-count">노트 ${g.notes.length}개</span>${isNow ? '<span class="wk-now">이번 주</span>' : ""}</summary>
        ${g.notes.map(n => noteCard(n, filter)).join("")}
      </details>`;
  }).join("");
}

function newsIssues(text, max = 3) {
  const KEYWORDS = ["유가","관세","AI","폭염","폭우","여행","항공","호텔","리조트","물가","소비","금리","환율","부동산","실적","화재","수출","플랫폼","SNS","창업","청년"];
  const items = text.split("■").slice(1).map(s => {
    const first = s.split("\n")[0].trim();
    const sent = first.split(". ")[0];
    return sent.length > 60 ? sent.slice(0, 58) + "…" : sent;
  });
  const scored = items.map((t, i) => ({ t, i, score: KEYWORDS.reduce((s, k) => s + (t.includes(k) ? 1 : 0), 0) }));
  const picked = [...scored].sort((a, b) => b.score - a.score || a.i - b.i).slice(0, max).sort((a, b) => a.i - b.i);
  return picked.map(p => p.t);
}

    <div class="b-kicker" style="color: var(--series-6);">주간 뉴스 브리핑 · 고정</div>
    <h2>이번 주 이슈와 나에게 관련된 것</h2>
    <div class="b-period">${b.period}</div>
    <p>${b.summary}</p>
    <h3>나에게 관련된 이슈</h3>
    <ul>${b.relevant.map(r => `<li>${r}</li>`).join("")}</ul>`;
}

function newsDayCard(n, open) {
  return `
    <details class="ncard" ${open ? "open" : ""}>
      <summary>
        <div class="nc-meta"><span>${n.date}</span><span>간추린 아침뉴스</span></div>
        <div class="issue-chips">${newsIssues(n.text).map(t => `<div class="issue-chip"><span>${t}</span></div>`).join("")}</div>
        <div class="nc-open-hint">탭해서 전체 뉴스 보기 ▾</div>
      </summary>
      <div class="ncard-body"><div class="news-full">${n.text.replace(/^📮[^\n]*\n?/, "").trim()}</div></div>
    </details>`;
}

function newsWeeksHtml(days) { // days: 최신순
  const groups = new Map();
  days.forEach(n => {
    const ws = weekStartOf(n.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, days: [] });
    groups.get(key).days.push(n);
  });
  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const weeks = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  return weeks.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""} style="margin-left: 6px;">
        <summary>${fmtWeek(g.start, end)} <span class="wk-count">뉴스 ${g.days.length}일치</span>${isNow ? '<span class="wk-now" style="background: var(--series-6);">이번 주</span>' : ""}</summary>
        ${g.days.map(newsDayCard).join("")}
      </details>`;
  }).join("");
}

function renderNews() {
  const el = document.getElementById("news-cards");
  if (!NEWS.length) { el.innerHTML = '<div class="empty">뉴스 데이터를 불러오는 중...</div>'; return; }
  const sorted = NEWS.slice().sort((a, b) => b.date.localeCompare(a.date));
  const months = new Map(); // "2026-07" -> days
  sorted.forEach(n => {
    const mk = n.date.slice(0, 7);
    if (!months.has(mk)) months.set(mk, []);
    months.get(mk).push(n);
  });
  const keys = [...months.keys()].sort().reverse();
  el.innerHTML = keys.map((mk, i) => {
    const [y, m] = mk.split("-");
    return `
      <details class="week month-group" data-month="${mk}" ${i === 0 ? "open" : ""}>
        <summary>${y}년 ${parseInt(m)}월 <span class="wk-count">뉴스 ${months.get(mk).length}일치</span></summary>
        <div class="month-body">${i === 0 ? newsWeeksHtml(months.get(mk)) : ""}</div>
      </details>`;
  }).join("");
  // 지연 렌더링: 월을 열 때 내용 생성
  el.querySelectorAll(".month-group").forEach(mg => {
    mg.addEventListener("toggle", () => {
      const body = mg.querySelector(".month-body");
      if (mg.open && !body.innerHTML.trim()) {
        body.innerHTML = newsWeeksHtml(months.get(mg.dataset.month));
      }
    });
  });
}

fetch("news.json").then(r => r.json()).then(data => { NEWS = data; renderNews(); renderLatestNews(); }).catch(() => {});

/* ══════════ GS 실적 시각화 ══════════ */
const _fmt = n => (n === null || n === undefined) ? "-" : Math.round(n).toLocaleString("ko-KR");
const _pct = n => (n === null || n === undefined) ? "-" : (n > 0 ? "+" : "") + n.toFixed(1) + "%";
const _esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* 예상 착지(FCST 달성률) 기준 상태 — 색은 반드시 라벨과 함께 쓴다 */
function _landing(fcstAch) {
  if (fcstAch === null || fcstAch === undefined) return { k: "none", t: "예상 없음", c: "var(--muted)" };
  if (fcstAch >= 100) return { k: "good", t: "달성 예상", c: "var(--st-good)" };
  if (fcstAch >= 97) return { k: "warn", t: "근소 미달", c: "var(--st-warn)" };
  return { k: "bad", t: "미달 예상", c: "var(--st-serious)" };
}

/* ── 월별 목표 대비 진척 (bullet) ── */
function _monthBullets() {
  return GS_PERF.months.map(m => {
    const span = Math.max(m.budget, m.fcst || 0, m.actual) * 1.02;
    const wA = m.actual / span * 100, wF = (m.fcst || 0) / span * 100, wB = m.budget / span * 100;
    const L = _landing(m.fcstAch);
    return `
      <div class="mb-row">
        <div class="mb-top">
          <span class="mb-name">${m.label}</span>
          <span class="mb-ach">${m.ach.toFixed(1)}<span class="u">%</span></span>
          <span class="mb-badge" style="color:${L.c};border-color:${L.c}">${L.t} ${m.fcstAch ? m.fcstAch.toFixed(1) + "%" : ""}</span>
        </div>
        <div class="mb-track">
          <div class="mb-fill" style="width:${wA.toFixed(2)}%"></div>
          <div class="mb-tick mb-fcst" style="left:${wF.toFixed(2)}%" title="예상 ${_fmt(m.fcst)}실"></div>
          <div class="mb-tick mb-bud" style="left:${wB.toFixed(2)}%" title="목표 ${_fmt(m.budget)}실"></div>
        </div>
        <div class="mb-nums">
          <span>OTB <b>${_fmt(m.actual)}</b>실</span>
          <span>목표 ${_fmt(m.budget)}</span>
          <span>예상 ${_fmt(m.fcst)}</span>
          <span class="${(m.yoyRn || 0) >= 0 ? "up" : "down"}">작년비 ${_pct(m.yoyRn)}</span>
        </div>
      </div>`;
  }).join("");
}

/* ── SVG 라인 차트 (크로스헤어 + 툴팁) ── */
function _lineChart(host, labels, series, opt) {
  opt = opt || {};
  const W = Math.max(host.clientWidth || 320, 260), H = opt.h || 170;
  const PL = 38, PR = 12, PT = 12, PB = 22;
  const flat = series.reduce((a, s) => a.concat(s.data), []);
  if (opt.ref) flat.push(opt.ref.v);
  let mn = Math.min.apply(null, flat), mx = Math.max.apply(null, flat);
  if (opt.zero) mn = Math.min(0, mn);
  const vfmt = v => (opt.dec != null ? v.toFixed(opt.dec) : _fmt(v)) + (opt.unit || "");
  const pd = (mx - mn) * 0.14 || 1; mx += pd; mn -= pd;
  const n = labels.length;
  const X = i => PL + (W - PL - PR) * (n === 1 ? 0.5 : i / (n - 1));
  const Y = v => PT + (H - PT - PB) * (1 - (v - mn) / (mx - mn));

  const ticks = [mn + (mx - mn) * 0.1, (mn + mx) / 2, mx - (mx - mn) * 0.1];
  let g = ticks.map(t => `<line x1="${PL}" x2="${W - PR}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" class="vz-grid"/>
      <text x="${PL - 6}" y="${(Y(t) + 3).toFixed(1)}" class="vz-tick" text-anchor="end">${vfmt(t)}</text>`).join("");
  if (mn < 0 && mx > 0) g += `<line x1="${PL}" x2="${W - PR}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" class="vz-base"/>`;
  if (opt.ref) g += `<line x1="${PL}" x2="${W - PR}" y1="${Y(opt.ref.v).toFixed(1)}" y2="${Y(opt.ref.v).toFixed(1)}" class="vz-ref"/>
      <text x="${W - PR}" y="${(Y(opt.ref.v) - 4).toFixed(1)}" class="vz-reflab" text-anchor="end">${_esc(opt.ref.t)}</text>`;

  const paths = series.map(sr => {
    const p = sr.data.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    const last = sr.data.length - 1;
    return `<path d="${p}" fill="none" stroke="${sr.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(last).toFixed(1)}" cy="${Y(sr.data[last]).toFixed(1)}" r="4" fill="${sr.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  }).join("");

  const minGap = 46;
  const keep = [];
  const step = Math.ceil(n / 5);
  for (let i = 0; i < n; i++) if (i % step === 0) keep.push(i);
  if (keep[keep.length - 1] !== n - 1) {
    while (keep.length && X(n - 1) - X(keep[keep.length - 1]) < minGap) keep.pop();
    keep.push(n - 1);
  }
  const xlab = keep.map(i => {
    const anc = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
    const x = i === 0 ? X(0) - 4 : i === n - 1 ? X(n - 1) + 4 : X(i);
    return `<text x="${x.toFixed(1)}" y="${H - 6}" class="vz-tick" text-anchor="${anc}">${labels[i]}</text>`;
  }).join("");

  host.innerHTML =
    `<div class="vz-legend">${series.map(sr =>
      `<span class="vz-lg"><i style="background:${sr.color}"></i>${_esc(sr.name)}</span>`).join("")}</div>
     <div class="vz-wrap">
       <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${_esc(opt.alt || "추이 차트")}">
         ${g}${paths}${xlab}
         <line class="vz-cross" x1="0" x2="0" y1="${PT}" y2="${H - PB}" style="display:none"/>
         <rect x="${PL}" y="0" width="${W - PL - PR}" height="${H}" fill="transparent" class="vz-hit"/>
       </svg>
       <div class="vz-tip" style="display:none"></div>
     </div>`;

  const svg = host.querySelector("svg"), tip = host.querySelector(".vz-tip"), cross = host.querySelector(".vz-cross");
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * W;
    let i = Math.round((px - PL) / ((W - PL - PR) / Math.max(n - 1, 1)));
    i = Math.max(0, Math.min(n - 1, i));
    cross.style.display = ""; cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
    tip.style.display = "";
    tip.innerHTML = `<b>${_esc(labels[i])}</b>` + series.map(sr =>
      `<span><i style="background:${sr.color}"></i>${_esc(sr.name)} <b>${opt.tip ? opt.tip(sr, i) : _fmt(sr.data[i])}</b></span>`).join("");
    const lft = X(i) / W * r.width;
    tip.style.left = Math.min(Math.max(lft, 8), r.width - 8) + "px";
    tip.style.transform = "translateX(" + (lft > r.width * 0.6 ? "-100%" : "-50%") + ")";
  };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cross.style.display = "none"; });
}

/* ── 발산형 가로 막대 ── */
function _divBars(rows, opt) {
  opt = opt || {};
  const mx = Math.max.apply(null, rows.map(r => Math.abs(r.v))) || 1;
  return `<div class="dv">${rows.map(r => {
    const w = Math.abs(r.v) / mx * 50;
    const pos = r.v >= 0;
    return `<div class="dv-row">
      <div class="dv-name" title="${_esc(r.n)}">${_esc(r.n)}</div>
      <div class="dv-track">
        <div class="dv-mid"></div>
        <div class="dv-bar ${pos ? "pos" : "neg"}" style="${pos ? "left:50%" : "right:50%"};width:${w.toFixed(2)}%"></div>
      </div>
      <div class="dv-val ${pos ? "pos" : "neg"}">${opt.pct ? _pct(r.v) : (r.v > 0 ? "+" : "") + _fmt(r.v)}</div>
    </div>`;
  }).join("")}</div>`;
}

/* ── 채널 × 주 히트 테이블 ── */
function _chanTable() {
  const wk = GS_PERF.chan;
  if (!wk.length) return "";
  const names = Object.keys(wk[wk.length - 1].ch);
  const all = wk.reduce((a, w) => a.concat(names.map(n => w.ch[n] || 0)), []);
  const mx = Math.max.apply(null, all.map(Math.abs)) || 1;
  const cell = v => {
    const o = Math.min(Math.abs(v) / mx, 1) * 0.85 + 0.05;
    const c = v >= 0 ? "var(--dv-pos)" : "var(--dv-neg)";
    return `<td style="background:color-mix(in srgb, ${c} ${(o * 100).toFixed(0)}%, transparent)">${v > 0 ? "+" : ""}${_fmt(v)}</td>`;
  };
  return `<div class="ct-scroll"><table class="ct">
    <thead><tr><th>채널</th>${wk.map(w => `<th>${_esc(w.l)}</th>`).join("")}</tr></thead>
    <tbody>${names.map(n => `<tr><th>${_esc(n)}</th>${wk.map(w => cell(w.ch[n] || 0)).join("")}</tr>`).join("")}
      <tr class="ct-tot"><th>합계</th>${wk.map(w => `<td>${w.total > 0 ? "+" : ""}${_fmt(w.total)}</td>`).join("")}</tr>
    </tbody></table></div>`;
}

let _fcMonth = null;

function _segChips(id, segs, off) {
  return `<div class="sg-chips" data-chips="${id}" role="group" aria-label="세그먼트 표시 선택">` +
    segs.map(sg => `<button type="button" class="sg-chip${off.has(sg) ? " off" : ""}" data-seg="${_esc(sg)}" aria-pressed="${!off.has(sg)}">
      <span class="sg-dot" style="background:${SEG_COLOR[sg] || "var(--muted)"}"></span>${_esc(sg)}</button>`).join("") +
    `</div>`;
}

/* ── 1 · 월별 × 세그먼트 목표 대비 (진행률 · 예상 달성률) ── */
function _segMonthBody() {
  const SM = GS_PERF.segMonth;
  if (!SM || !SM.labels.length) return "";
  const vis = SM.segs.filter(sg => !_segOff1.has(sg));
  let mx = 118;
  SM.labels.forEach(lb => vis.forEach(sg => {
    const r = (SM.data[lb] || {})[sg];
    if (r) mx = Math.max(mx, r.ach || 0, r.fcstAch || 0);
  }));
  mx = Math.ceil((mx + 8) / 10) * 10;
  const W = v => Math.max(Math.min((v || 0) / mx * 100, 100), 0);

  return SM.labels.map(lb => {
    const m = GS_PERF.months.filter(x => x.label === lb)[0] || {};
    const rows = vis.map(sg => {
      const r = (SM.data[lb] || {})[sg];
      if (!r) return "";
      const L = _landing(r.fcstAch), C = SEG_COLOR[sg] || "var(--muted)", net = r.todayNet || 0;
      return `
        <div class="sm-row">
          <div class="sm-name" title="${_esc(sg)}"><span class="sg-dot" style="background:${C}"></span>${_esc(sg)}</div>
          <div class="sm-track">
            <div class="sm-fill" style="width:${W(r.ach).toFixed(2)}%;background:${C}"></div>
            <div class="sm-goal" style="left:${W(100).toFixed(2)}%" title="목표 100%"></div>
            ${r.fcstAch ? `<div class="sm-tick" style="left:${W(r.fcstAch).toFixed(2)}%" title="예상 달성률 ${r.fcstAch.toFixed(1)}%"></div>` : ""}
          </div>
          <div class="sm-pct">${(r.ach || 0).toFixed(1)}<span>%</span></div>
        </div>
        <div class="sm-nums">
          <span class="sm-net ${net >= 0 ? "up" : "down"}">데일리 순증 <b>${net > 0 ? "+" : ""}${_fmt(net)}</b>실</span>
          <span style="color:${L.c}">예상실적 <b>${_fmt(r.fcst)}</b>실 · ${L.t}${r.fcstAch ? " " + r.fcstAch.toFixed(1) + "%" : ""}</span>
          <span>목표 ${_fmt(r.budget)}실</span>
        </div>`;
    }).join("");
    return `<div class="sm-month">
      <div class="sm-mhead">${_esc(lb)}<span>목표 ${_fmt(m.budget)}실 · 작년비 ${_pct(m.yoyRn)}</span></div>
      ${rows}</div>`;
  }).join("");
}

/* ── 1-b · 예상실적(RM FCST) 주간 변화 ── */
function _monChips() {
  return `<div class="sg-chips mode" data-chips="mon" role="group" aria-label="달 선택">` +
    GS_PERF.fcstTrend.months.map(m =>
      `<button type="button" class="sg-chip${m.label === _fcMonth ? " on" : ""}" data-mon="${_esc(m.label)}" aria-pressed="${m.label === _fcMonth}">${_esc(m.label)}</button>`).join("") +
    `</div>`;
}

function _fcTable(mo, vis) {
  return `<div class="ct-scroll"><table class="ct">
    <thead><tr><th>세그</th>${mo.dates.map(d => `<th>${_esc(d)}</th>`).join("")}</tr></thead>
    <tbody>${vis.map(sg => `<tr><th>${_esc(sg)}</th>${(mo.series[sg] || []).map(v => `<td>${_fmt(v)}</td>`).join("")}</tr>`).join("")}
      <tr class="ct-tot"><th>목표</th><td colspan="${mo.dates.length}">${vis.map(sg => `${_esc(sg)} ${_fmt(mo.budget[sg])}실`).join(" · ")}</td></tr>
    </tbody></table></div>`;
}

function _renderFc() {
  const host = document.getElementById("gs-fc");
  const FT = GS_PERF.fcstTrend;
  if (!host || !FT || !FT.months.length) return;
  if (!_fcMonth || !FT.months.some(m => m.label === _fcMonth)) _fcMonth = FT.months[0].label;
  const mo = FT.months.filter(m => m.label === _fcMonth)[0];
  const vis = FT.segs.filter(sg => !_segOff2.has(sg) && (mo.series[sg] || []).length);
  const base = FT.segs.indexOf("전체") >= 0 ? "전체" : FT.segs[0];
  const arr = mo.series[base] || [];
  const a0 = arr[0], a1 = arr[arr.length - 1], d = a1 - a0;
  const ach = mo.budget[base] ? a1 / mo.budget[base] * 100 : 0;
  const L = _landing(ach);

  host.innerHTML = `
    ${_monChips()}
    ${_segChips("m2", FT.segs, _segOff2)}
    <div id="gs-fc-chart"></div>
    <div class="fc-delta">${_esc(mo.label)} <b>${_esc(base)}</b> 예상실적은
      ${_esc(mo.dates[0])} <b>${_fmt(a0)}실</b> → ${_esc(mo.dates[mo.dates.length - 1])} <b>${_fmt(a1)}실</b>
      (<b class="${d >= 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${_fmt(d)}실</b>),
      목표 ${_fmt(mo.budget[base])}실 대비 <b style="color:${L.c}">${ach.toFixed(1)}% · ${L.t}</b>.</div>
    <details class="perf-more"><summary>주차별 숫자 표로 보기 (실)</summary>${_fcTable(mo, vis)}</details>`;

  _lineChart(document.getElementById("gs-fc-chart"), mo.dates,
    vis.map(sg => ({
      name: sg, color: SEG_COLOR[sg] || "var(--muted)",
      data: (mo.series[sg] || []).map(v => mo.budget[sg] ? v / mo.budget[sg] * 100 : 0),
      raw: mo.series[sg] || [],
    })),
    {
      alt: mo.label + " 세그먼트별 예상 달성률 주간 변화", unit: "%", dec: 0,
      ref: { v: 100, t: "목표 100%" },
      tip: (sr, i) => `${_fmt(sr.raw[i])}실 · ${sr.data[i].toFixed(1)}%`,
    });
}

/* ── 실적 한눈에에 붙일 그날의 GS 데일리 요약 찾기 ── */
function _gsDailyFor(asOf) {
  if (typeof GS_DAILY === "undefined" || !GS_DAILY.length) return null;
  const t = String(asOf || "");
  const d = t.length === 8 ? t.slice(0, 4) + "-" + t.slice(4, 6) + "-" + t.slice(6, 8) : t;
  const asc = GS_DAILY.slice().sort((a, b) => a.date.localeCompare(b.date));
  return asc.filter(g => g.date >= d)[0] || asc[asc.length - 1];
}

function renderGsPerf() {
  const el = document.getElementById("gs-perf");
  if (!el || typeof GS_PERF === "undefined") return;
  const P = GS_PERF;
  const cy = P.daily.cy.map(r => r.n), ly = P.daily.ly.map(r => r.n);
  const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
  const c7 = avg(cy.slice(-7)), l7 = avg(ly.slice(-7));
  const paceP = l7 ? (c7 - l7) / Math.abs(l7) * 100 : 0;
  const risk = P.months.filter(m => _landing(m.fcstAch).k === "bad" || _landing(m.fcstAch).k === "warn");
  const worst = P.prop[P.prop.length - 1], best = P.prop[0];
  const gd = _gsDailyFor(P.asOf);

  el.innerHTML = `
    <div class="perf-head">
      <h3>실적 한눈에</h3>
      <span class="perf-when">${P.asOfLabel} 기준 · 원본 자동 수집</span>
    </div>

    <div class="perf-lede">
      ${risk.length ? `<b>${risk.map(m => m.label).join("·")}</b>은 예상 착지가 목표에 못 미칩니다 (${risk.map(m => m.fcstAch.toFixed(1) + "%").join(" · ")}).`
      : `세 달 모두 예상 착지가 목표를 넘습니다.`}
      최근 7일 하루 평균 순증은 <b>${_fmt(c7)}실</b>로 작년 같은 기간(${_fmt(l7)}실) 대비 <b class="${paceP >= 0 ? "up" : "down"}">${_pct(paceP)}</b>.
      사업장은 <b>${_esc(best.n)} ${_pct(best.pct)}</b>부터 <b>${_esc(worst.n)} ${_pct(worst.pct)}</b>까지 벌어져 있습니다.
    </div>

    ${gd ? `
    <div class="perf-daily">
      <div class="pd-head"><b>${gd.date} GS 데일리 요약</b><span>${P.asOfLabel} 실적 기준 · 아래 뉴스·이슈 아카이브에서 가져왔습니다</span></div>
      <div class="pd-kpi">${gd.kpiLine}</div>
      <ul>${gd.kpi.map(k => `<li>${k}</li>`).join("")}</ul>
      ${gd.insight ? `<div class="pd-insight">${gd.insight}</div>` : ""}
      <details class="perf-more"><summary>그날 소노 · 호텔/리조트 · OTA 이슈 ${gd.sono.length + gd.hotel.length + gd.ota.length}건 펼치기</summary>
        <ul>${[].concat(gd.sono, gd.hotel, gd.ota).map(t => `<li>${t}</li>`).join("")}</ul>
      </details>
    </div>` : ""}

    <section class="perf-sec">
      <h4>1 · 월별 목표 대비 <span>진행률 · 예상 달성률 · 세그먼트별</span></h4>
      ${_segChips("m1", (P.segMonth || { segs: [] }).segs, _segOff1)}
      <div id="gs-m1">${_segMonthBody()}</div>
      <div class="perf-note">막대는 <b>진행률</b>(목표 대비 현재 OTB, %). <i class="lg-bud"></i> 목표 100% ·
        <i class="lg-fcst"></i> <b>예상 달성률</b>. 아래 줄의 <b>데일리 순증</b>과 <b>예상실적</b>은 색을 달리 표시했습니다
        (순증은 증감 색, 예상실적은 착지 상태 색).
        칩을 눌러 세그먼트를 숨길 수 있고, 숨겨도 남은 세그먼트의 색은 그대로입니다.
        진행률만 보면 9월이 낮아 보이지만 예약 리드타임 탓이라 <b>예상 달성률</b>이 진짜 신호입니다.</div>
    </section>

    <section class="perf-sec">
      <h4>1-b · 예상실적 주간 변화 <span>RM FCST 주간 스냅샷${P.fcstAsOf ? " · " + _esc(P.fcstAsOf) + " 최신" : ""}</span></h4>
      <div id="gs-fc"></div>
      <div class="perf-note">세로축은 <b>목표 대비 예상 달성률</b>이라 규모가 다른 세그먼트도 한 축에서 비교됩니다.
        선을 짚으면 실제 예상실적(실)이 같이 뜨고, 아래 표에서 주차별 원수치를 볼 수 있습니다.
        달 칩으로 월을 바꾸고, 세그 칩으로 숨깁니다.</div>
    </section>

    <section class="perf-sec">
      <h4>2 · 일별 픽업 페이스 <span>작년 동기간 대비</span></h4>
      <div id="gs-pace"></div>
      <div class="perf-note">순증 = 픽업 − 취소. 작년은 같은 요일 기준으로 맞춰 비교합니다.</div>
    </section>

    <section class="perf-sec">
      <h4>3 · 세그먼트 주간 추이 <span>OTA · G-OTA · Inbound</span></h4>
      <div id="gs-seg"></div>
      <details class="perf-more"><summary>당일 전체 세그먼트 순증 (${P.seg.allToday.length}개)</summary>
        ${_divBars(P.seg.allToday.map(r => ({ n: r.n, v: r.net })))}
      </details>
    </section>

    <section class="perf-sec">
      <h4>4 · 채널별 주간 순증 <span>최근 ${P.chan.length}주</span></h4>
      ${_chanTable()}
      <div class="perf-note">파랑은 순증, 빨강은 순감. 색이 진할수록 폭이 큽니다. 가로로 넘겨서 보세요.</div>
    </section>

    <section class="perf-sec">
      <h4>5 · 사업장별 작년 대비 <span>${_esc(P.curMonth)} OTB · ${P.prop.length}곳</span></h4>
      ${_divBars(P.prop.slice(0, 5).map(r => ({ n: r.n, v: r.pct })), { pct: true })}
      <details class="perf-more"><summary>가운데 ${Math.max(P.prop.length - 10, 0)}곳 펼치기</summary>
        ${_divBars(P.prop.slice(5, -5).map(r => ({ n: r.n, v: r.pct })), { pct: true })}
      </details>
      ${_divBars(P.prop.slice(-5).map(r => ({ n: r.n, v: r.pct })), { pct: true })}
      <div class="perf-note">${_esc(P.curMonth)} 매출 달성률 ${P.revAch}% · 전체 OTB 작년비 ${_pct(P.otbYoy)}.
        <a class="link" href="${P.src}" target="_blank">원본 대시보드 →</a></div>
    </section>`;

  const L = P.seg.labels;
  _lineChart(document.getElementById("gs-pace"), L, [
    { name: "2026", color: "var(--series-1)", data: cy },
    { name: "2025", color: "var(--series-2)", data: ly }
  ], { zero: true, alt: "일별 순증 올해 대 작년" });

  _lineChart(document.getElementById("gs-seg"), L, [
    { name: "OTA", color: "var(--series-1)", data: P.seg.weekly["OTA"] || [] },
    { name: "G-OTA", color: "var(--series-2)", data: P.seg.weekly["G-OTA"] || [] },
    { name: "Inbound", color: "var(--series-3)", data: P.seg.weekly["Inbound"] || [] }
  ], { zero: true, alt: "세그먼트별 주간 순증 추이" });

  _renderFc();

  if (!el._wired) {
    el._wired = true;
    el.addEventListener("click", ev => {
      const c = ev.target.closest && ev.target.closest(".sg-chip");
      if (!c) return;
      const box = c.closest("[data-chips]");
      if (!box) return;
      const id = box.dataset.chips;
      if (id === "mon") { _fcMonth = c.dataset.mon; _renderFc(); return; }
      const set = id === "m1" ? _segOff1 : _segOff2;
      const all = id === "m1" ? GS_PERF.segMonth.segs : GS_PERF.fcstTrend.segs;
      const sg = c.dataset.seg;
      if (set.has(sg)) set.delete(sg);
      else { if (all.length - set.size <= 1) return; set.add(sg); }
      if (id === "m1") {
        c.classList.toggle("off", set.has(sg));
        c.setAttribute("aria-pressed", String(!set.has(sg)));
        document.getElementById("gs-m1").innerHTML = _segMonthBody();
      } else _renderFc();
    });
  }
}

function gsDayCard(g) {
  const sec = (title, arr, color) => `
    <details ${title === "실적 KPI" ? "open" : ""}>
      <summary><span class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>${title}</summary>
      <div class="body"><ul>${arr.map(i => `<li>${i}</li>`).join("")}</ul></div>
    </details>`;
  return `
    <details class="ncard">
      <summary>
        <div class="nc-meta"><span>${g.date}</span><span>GS 데일리 요약</span></div>
        <div class="issue-chips">
          <div class="issue-chip" style="font-weight:600;"><span>${g.kpiLine}</span></div>
          ${[g.sono[0], g.sono[1]].filter(Boolean).map(t => `<div class="issue-chip"><span>${t.replace(/<[^>]+>/g, "")}</span></div>`).join("")}
        </div>
        <div class="nc-open-hint">탭해서 전체 요약 보기 ▾</div>
      </summary>
      <div class="ncard-body">
        ${sec("실적 KPI", g.kpi, "var(--series-5)")}
        ${sec("소노", g.sono, "var(--series-1)")}
        ${sec("호텔/리조트", g.hotel, "var(--series-3)")}
        ${sec("OTA/여행", g.ota, "var(--series-6)")}
        ${g.insight ? `<details open><summary>오늘의 시사점</summary><div class="body"><p style="font-size:0.85rem;color:var(--text-secondary);">${g.insight}</p></div></details>` : ""}
      </div>
    </details>`;
}

function renderGs() {
  const el = document.getElementById("gs-cards");
  const sorted = GS_DAILY.slice().sort((a, b) => b.date.localeCompare(a.date));
  const groups = new Map();
  sorted.forEach(g => {
    const ws = weekStartOf(g.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, days: [] });
    groups.get(key).days.push(g);
  });
  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const weeks = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  el.innerHTML = weeks.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""}>
        <summary>${fmtWeek(g.start, end)} <span class="wk-count">리포트 ${g.days.length}일치</span>${isNow ? '<span class="wk-now" style="background: var(--series-5);">이번 주</span>' : ""}</summary>
        ${g.days.map(gsDayCard).join("")}
      </details>`;
  }).join("");
}

    insight: "오늘 두 기사를 나란히 놓으면 업계가 어디로 가는지 보입니다. 소노는 <strong>베스트웨스턴을 소노벨로 리브랜딩</strong>해 44곳 체제를 만들었습니다 — 짓지 않고 운영제휴로 브랜드를 늘리는 자산경량(asset-light) 확장입니다. 같은 날 롯데호텔은 <strong>객실을 줄이고 의료시설을 넣었습니다</strong> — 방을 파는 사업에서 체류 목적을 파는 사업으로 카테고리를 옮기는 시도입니다. 하나는 '더 많은 간판', 하나는 '다른 목적'. 여기에 매직 아트 페스타(8곳 동시 콘텐츠), 소노펫 라운지(반려견), 인스파이어 K뷰티 패키지(인바운드 VIP)를 더하면 공통점이 하나 나옵니다 — <strong>객실 단가가 아니라 '왜 오는가'로 경쟁이 옮겨가는 중</strong>입니다. 롱블랙 노트와 겹치는 지점도 분명합니다. 솔트앤스톤(2065)이 '데오드란트'라는 기존 카테고리를 향수 대체재로 재정의해 이겼듯, 롯데호텔의 의료시설은 같은 문법입니다. 제품을 바꾸지 않고 <strong>맥락을 바꿔 경쟁 상대를 갈아치우는 것</strong> — 이번 주 브랜딩 렌즈의 실물 사례로 볼 만합니다."

const API_QUOTA = [
  { name: "검색 API (뉴스)",  used: 300, cap: 775000, unit: "월", note: "주 1회 레이더 ~70콜 · 일 한도 25,000", live: true },
  { name: "검색어 트렌드",     used: 0,   cap: 30000,  unit: "월", note: "구독 대기 · 승인 시 주 1콜", live: false },
  { name: "쇼핑 인사이트",     used: 0,   cap: 30000,  unit: "월", note: "구독 대기 · 승인 시 주 1콜", live: false }
];

function renderInsightBrief() {
  const latest = INSIGHT_DAILY[0];
  const q = API_QUOTA.map(a => {
    const pct = (a.used / a.cap * 100);
    const p = pct < 0.01 ? "<0.01" : pct.toFixed(2);
    return `<div class="quota-row">
      <div class="q-name">${a.name}<span class="q-note">${a.note}</span></div>
      <div class="q-bar"><span style="width:${Math.max(pct, 0.6)}%"></span></div>
      <div class="q-num">${a.used.toLocaleString()} / ${a.cap.toLocaleString()} <em>${p}%</em></div>
    </div>`;
  }).join("");
  document.getElementById("insight-brief").innerHTML = `
    <div class="b-kicker" style="color: var(--series-7);">뉴스 인사이트 · 매일 갱신</div>
    <h2>소노 · 레저 데일리 + 주간 키워드 레이더</h2>
    <div class="b-period">최신: ${latest ? latest.date : "-"} · 소노 ${latest ? latest.sono.length : 0}건 · 레저 ${latest ? latest.leisure.length : 0}건</div>
    <p>매일 소노·호텔·레저 기사를 원문 링크째로 쌓고, 주 1회 네이버 검색 API로 20개 키워드의 기사 발생량을 지난주와 맞대어 봅니다.
    <a class="link" href="https://cksals00-ai.github.io/gs_daily_trend_news_public_temp/index.html" target="_blank">뉴스 원본 →</a></p>
    <div class="quota">
      <div class="quota-title">무료 한도 대비 호출량 설계치</div>
      ${q}
      <div class="quota-foot">세 API 모두 무료 구간 안에서만 돕니다. 10배로 늘려도 유료 구간에 닿지 않습니다.</div>
    </div>`;
}

function renderTrend() {
  const el = document.getElementById("insight-trend");
  const arrow = p => p > 0 ? "▲" : (p < 0 ? "▼" : "―");
  const cls   = p => p > 0 ? "up" : (p < 0 ? "down" : "");

  const all = TREND_PLAN.groups.flatMap(g => g.kw.map(k => Object.assign({ g: g.name }, k)));
  const rate = k => k.prev === 0 ? null : (k.cur - k.prev) / k.prev * 100;
  const movers = all.filter(k => k.prev >= 10 && k.cur + k.prev >= 40)
                    .map(k => Object.assign({ p: rate(k) }, k))
                    .sort((a, b) => b.p - a.p);
  const up = movers.slice(0, 2), dn = movers.slice(-2).reverse();
  const chip = m => `<strong>${m.n}</strong> <em class="${cls(m.p)}">${arrow(m.p)}${Math.abs(Math.round(m.p))}%</em>`;

  const body = TREND_PLAN.groups.map(g => {
    const max = Math.max.apply(null, g.kw.map(k => k.cur).concat([1]));
    const rows = g.kw.map(k => {
      const p = rate(k);
      const num = p === null
        ? `${k.cur}건<em>신규</em>`
        : `${k.cur}건<em class="${cls(p)}">${arrow(p)}${Math.round(p)===0?"":Math.abs(Math.round(p))+"%"}</em>`;
      const links = k.top.length
        ? `<ul class="src-list">${k.top.map(t => `<li><a href="${t.u}" target="_blank" rel="noopener">${t.t}</a></li>`).join("")}</ul>`
        : `<div class="kw-empty">이번 주 기사 없음</div>`;
      return `<details class="kw-det"><summary><div class="trend-row">
          <div class="tr-name">${k.n}</div>
          <div class="tr-bar"><span style="width:${Math.max(k.cur / max * 100, 3)}%"></span></div>
          <div class="tr-num">${num}</div>
        </div></summary><div class="kw-body">${links}</div></details>`;
    }).join("");
    return `<div class="tg-name">${g.name}</div>${rows}`;
  }).join("");

  el.innerHTML = `
    <div class="trend-box">
      <div class="trend-head">
        <h3>주간 키워드 레이더</h3>
        <span class="trend-when">${TREND_PLAN.weekFrom.slice(5).replace("-", ".")} ~ ${TREND_PLAN.weekTo.slice(5).replace("-", ".")} · 지난주 대비</span>
      </div>
      <div class="mover">
        <div><span class="mv-tag">급등</span>${up.map(chip).join(" · ")}</div>
        <div><span class="mv-tag">급락</span>${dn.map(chip).join(" · ")}</div>
      </div>
      ${body}
      <div class="trend-note">
        집계 방식: 네이버 뉴스 검색 API로 키워드당 최대 1,000건을 최신순 스캔한 뒤,
        제목·본문에 키워드가 <em>문자 그대로</em> 들어있는 기사만 세었습니다.
        (네이버 검색은 단어를 쪼개서 매칭하기 때문에 날것 그대로는 노이즈가 큽니다.)
        이번 갱신 ${TREND_PLAN.calls}콜 · 일 한도 25,000.
        <br><span class="pending-badge">구독 대기</span>
        검색어 트렌드·쇼핑 인사이트는 Application에서 해당 API를 추가 구독하면
        “기사가 몇 건 나왔나” 위에 “사람들이 실제로 몇 번 검색했나”가 겹쳐집니다.
      </div>
    </div>`;
}

function insightDayCard(d, open) {
  const list = (title, arr, color) => `
    <details open>
      <summary><span class="dot" style="background:${color};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>${title} <span class="wk-count">${arr.length}건</span></summary>
      <div class="body">
        <ul class="src-list">
          ${arr.map(i => `<li><a href="${i.u}" target="_blank" rel="noopener">${i.t}</a><span class="press">${i.p}</span></li>`).join("")}
        </ul>
      </div>
    </details>`;
  return `
    <details class="ncard" ${open ? "open" : ""}>
      <summary>
        <div class="nc-meta"><span>${d.date}</span><span>뉴스 인사이트</span></div>
        <div class="issue-chips">
          <div class="issue-chip" style="font-weight:600;"><span>${d.headline}</span></div>
          ${[d.sono[0], d.sono[1]].filter(Boolean).map(i => `<div class="issue-chip"><span>${i.t}</span></div>`).join("")}
        </div>
        <div class="nc-open-hint">탭해서 전체 기사 보기 ▾</div>
      </summary>
      <div class="ncard-body">
        ${list("소노", d.sono, "var(--series-5)")}
        ${list("호텔·레저 업계", d.leisure, "var(--series-3)")}
        ${d.insight ? `<details open><summary>오늘의 인사이트</summary><div class="body"><p style="font-size:0.85rem;color:var(--text-secondary);">${d.insight}</p></div></details>` : ""}
      </div>
    </details>`;
}

function renderInsight() {
  const el = document.getElementById("insight-cards");
  const sorted = INSIGHT_DAILY.slice().sort((a, b) => b.date.localeCompare(a.date));
  const groups = new Map();
  sorted.forEach(d => {
    const ws = weekStartOf(d.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, days: [] });
    groups.get(key).days.push(d);
  });
  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const weeks = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  el.innerHTML = weeks.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""}>
        <summary>${fmtWeek(g.start, end)} <span class="wk-count">${g.days.length}일치</span>${isNow ? '<span class="wk-now" style="background: var(--series-7);">이번 주</span>' : ""}</summary>
        ${g.days.map(insightDayCard).join("")}
      </details>`;
  }).join("");
}

    if (t.dataset.tab === "gs") renderGsPerf();
  document.getElementById("view-insight").style.display = t.dataset.tab === "insight" ? "" : "none";
}));
