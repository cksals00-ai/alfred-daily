<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>롱블랙 데일리 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* 창업 */
    --series-2: #008300; /* 커리어 */
    --series-3: #e87ba4; /* 브랜딩 */
    --series-6: #eb6834; /* 뉴스 액센트 */
    --chip-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #008300;
      --series-3: #d55181;
      --series-6: #d95926;
      --chip-bg: #262624;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #008300;
    --series-3: #d55181;
    --series-6: #d95926;
    --chip-bg: #262624;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 20px 16px 60px;
    max-width: 860px;
    margin: 0 auto;
  }
  header { margin-bottom: 20px; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
  header p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
  .theme-toggle {
    float: right; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 8px; padding: 4px 10px;
    font-size: 0.78rem; cursor: pointer;
  }

  /* stat tiles */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
  }
  .tile .label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
  .tile .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .tile .sub { font-size: 0.72rem; color: var(--text-secondary); }

  /* aggregate perspective bars */
  .agg {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 18px;
  }
  .agg h2 { font-size: 0.9rem; margin-bottom: 4px; }
  .agg .desc { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 42px; align-items: center; gap: 10px; margin: 8px 0; }
  .bar-row .name { font-size: 0.8rem; color: var(--text-secondary); }
  .bar-track { height: 14px; background: var(--chip-bg); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 0 4px 4px 0; }
  .bar-val { font-size: 0.8rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

  /* tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 10px; padding: 10px 12px;
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .tab.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }

  /* news day cards */
  .issue-chips { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .issue-chip { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.5; display: flex; gap: 6px; }
  .issue-chip::before { content: "■"; font-size: 0.55rem; color: var(--series-6, #eb6834); margin-top: 4px; }
  .news-full { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.7; white-space: pre-wrap; padding-top: 12px; }

  /* weekly brief (pinned) */
  .brief {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 4px solid var(--series-1);
    border-radius: 14px; padding: 20px; margin-bottom: 18px;
  }
  .brief .b-kicker { font-size: 0.7rem; letter-spacing: 0.08em; color: var(--series-1); font-weight: 700; }
  .brief h2 { font-size: 1.05rem; margin: 4px 0 2px; }
  .brief .b-period { font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
  .brief h3 { font-size: 0.8rem; margin: 14px 0 6px; color: var(--text-primary); letter-spacing: 0.01em; }
  .brief p { font-size: 0.86rem; color: var(--text-secondary); margin-bottom: 6px; }
  .brief ul { padding-left: 18px; }
  .brief li { font-size: 0.85rem; color: var(--text-secondary); margin: 5px 0; }
  .brief li strong { color: var(--text-primary); font-weight: 600; }
  .brief .todo { list-style: none; padding-left: 2px; }
  .brief .todo li { display: flex; gap: 8px; align-items: flex-start; }
  .brief .todo input { margin-top: 4px; accent-color: var(--series-1); }
  .verse {
    margin-top: 14px; background: var(--chip-bg); border-radius: 10px; padding: 12px 14px;
  }
  .verse .v-label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 4px; }
  .verse .v-text { font-size: 0.9rem; line-height: 1.7; color: var(--text-primary); }
  .verse .v-ref { font-size: 0.75rem; color: var(--text-secondary); margin-top: 6px; text-align: right; }

  /* filters */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .filters .flabel { font-size: 0.75rem; color: var(--muted); margin-right: 2px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); border-radius: 999px; padding: 5px 12px;
    font-size: 0.78rem; cursor: pointer; transition: all .15s;
  }
  .chip.active { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  /* week groups */
  details.week { border: none; margin-bottom: 14px; }
  details.week > summary {
    padding: 10px 4px; font-size: 0.85rem; font-weight: 700; color: var(--text-primary);
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
  }
  details.week > summary::before { content: "▸"; font-size: 0.75rem; color: var(--muted); transition: transform .15s; }
  details.week[open] > summary::before { transform: rotate(90deg); }
  details.week > summary .wk-count { font-size: 0.72rem; font-weight: 500; color: var(--muted); }
  details.week > summary .wk-now {
    font-size: 0.66rem; font-weight: 600; color: var(--page); background: var(--series-1);
    border-radius: 999px; padding: 2px 8px;
  }

  /* note cards (collapsed by default) */
  details.ncard {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 10px; overflow: hidden;
  }
  details.ncard > summary {
    cursor: pointer; list-style: none; padding: 14px 16px !important;
    display: block !important;
  }
  details.ncard > summary::before { content: none !important; }
  details.ncard > summary::-webkit-details-marker { display: none; }
  details.ncard { border-top: 1px solid var(--border); }
  details.week > summary { display: flex !important; padding: 10px 4px !important; }
  details.week { border-top: none; }
  .nc-meta { font-size: 0.7rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nc-meta .nc-scores { display: inline-flex; gap: 6px; margin-left: auto; }
  .nc-meta .nc-s { display: inline-flex; align-items: center; gap: 3px; font-size: 0.7rem; font-weight: 600; color: var(--text-secondary); }
  .nc-title { font-size: 0.95rem; font-weight: 700; line-height: 1.45; margin: 5px 0 3px; color: var(--text-primary); }
  .nc-sum {
    font-size: 0.8rem; color: var(--text-secondary); line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  details.ncard[open] .nc-sum { display: none; }
  .nc-open-hint { font-size: 0.68rem; color: var(--muted); margin-top: 6px; }
  details.ncard[open] .nc-open-hint { display: none; }
  .ncard-body { padding: 0 16px 16px; border-top: 1px solid var(--grid); }
  .card .meta { font-size: 0.72rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .card h3 { font-size: 1.05rem; margin: 6px 0 2px; line-height: 1.4; }
  .ncard-body .subject { font-size: 0.8rem; color: var(--text-secondary); margin: 12px 0 10px; }
  .ncard-body .summary { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 14px; }

  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .score {
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px;
  }
  .score .sname { font-size: 0.68rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .score .sval { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score .strack { height: 6px; background: var(--chip-bg); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .score .sfill { height: 100%; border-radius: 0 3px 3px 0; }

  details { border-top: 1px solid var(--grid); }
  details summary {
    cursor: pointer; padding: 10px 0; font-size: 0.82rem; font-weight: 600;
    color: var(--text-secondary); list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details summary::before { content: "▸"; font-size: 0.7rem; color: var(--muted); transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details .body { padding: 0 0 12px; font-size: 0.85rem; }
  details ul { padding-left: 18px; }
  details li { margin: 5px 0; color: var(--text-secondary); }
  details li strong { color: var(--text-primary); font-weight: 600; }
  .full-summary p { color: var(--text-secondary); margin-bottom: 10px; text-align: justify; }
  .full-summary p:last-child { margin-bottom: 0; }
  blockquote {
    border-left: 3px solid var(--baseline); padding: 2px 0 2px 12px;
    margin: 8px 0; color: var(--text-secondary); font-size: 0.84rem; font-style: italic;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag { background: var(--chip-bg); color: var(--text-secondary); border-radius: 6px; padding: 3px 8px; font-size: 0.72rem; }
  .card a.link { font-size: 0.75rem; color: var(--series-1); text-decoration: none; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.85rem; }
  footer { margin-top: 24px; font-size: 0.72rem; color: var(--muted); text-align: center; }

  @media (max-width: 560px) {
    .tiles { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .tile { padding: 10px 12px; }
    .tile .value { font-size: 1.2rem; }
    .scores { grid-template-columns: 1fr; }
    .bar-row { grid-template-columns: 90px 1fr 38px; }
  }
</style>
</head>
<body>
<header>
  <button class="theme-toggle" onclick="toggleTheme()">☀ / ☾</button>
  <h1>롱블랙 데일리 대시보드</h1>
  <p>매일 읽은 노트를 세 가지 관점으로 정리하고, 나에게 맞는 주제를 찾아갑니다.</p>
</header>

<div class="tabs">
  <button class="tab active" data-tab="notes">📚 롱블랙 노트</button>
  <button class="tab" data-tab="news">📮 데일리 뉴스</button>
</div>

<div id="view-notes">
<div class="tiles">
  <div class="tile"><div class="label">누적 노트</div><div class="value" id="t-count">–</div><div class="sub" id="t-range"></div></div>
  <div class="tile"><div class="label">평균 적합도</div><div class="value" id="t-avg">–</div><div class="sub">5점 만점</div></div>
  <div class="tile"><div class="label">가장 끌린 관점</div><div class="value" id="t-top" style="font-size:1.05rem;">–</div><div class="sub" id="t-top-sub"></div></div>
</div>

<div class="agg">
  <h2>관점별 평균 적합도</h2>
  <div class="desc">데이터가 쌓일수록 어떤 관점의 노트가 나에게 잘 맞는지 패턴이 드러납니다.</div>
  <div id="agg-bars"></div>
</div>

<div class="brief" id="weekly-brief"></div>

<div class="filters" id="perspective-filters">
  <span class="flabel">관점</span>
  <button class="chip active" data-p="all">전체</button>
  <button class="chip" data-p="startup"><span class="dot" style="background:var(--series-1)"></span>창업·사이드프로젝트</button>
  <button class="chip" data-p="career"><span class="dot" style="background:var(--series-2)"></span>커리어·삶의 방향</button>
  <button class="chip" data-p="branding"><span class="dot" style="background:var(--series-3)"></span>브랜딩·마케팅</button>
</div>

<div id="cards"></div>
<div class="empty" id="empty" style="display:none;">이 관점에서 적합도 4.0 이상인 노트가 아직 없어요.</div>
</div><!-- /view-notes -->

<div id="view-news" style="display:none;">
  <div class="brief" id="news-brief" style="border-left-color: var(--series-6, #eb6834);"></div>
  <div id="news-cards"></div>
</div><!-- /view-news -->

<footer>새 노트가 추가될 때마다 이 대시보드가 업데이트됩니다 · 적합도는 세 관점 기준 0~5점</footer>

<script>
const PERSPECTIVES = {
  startup:  { name: "창업·사이드프로젝트", color: "var(--series-1)" },
  career:   { name: "커리어·삶의 방향",   color: "var(--series-2)" },
  branding: { name: "브랜딩·마케팅",     color: "var(--series-3)" },
};

/* ── 주간 브리핑: 매주 일요일 갱신 ─────────────────────────── */
const WEEKLY_BRIEF = {
  period: "2026.07.16 ~ 07.22 · 노트 9개 기준 (다음 갱신: 7/26 주일)",
  summary: "이번 주 노트들은 하나의 문장으로 수렴합니다 — \"성공은 의지나 규모가 아니라, 나의 위화감을 관찰해서 작게·깊게 설계한 데서 나온다.\" 세발서점·아레나·바이닐 성수는 모두 자기 불편함에서 출발해 규모 대신 밀도를 택한 비즈니스였고, 니체·심플·건강 노트는 남의 기준(척하기, 알고리즘, 자책)을 벗고 내 기준을 만드는 삶의 기술이었습니다. 덴츠와 AX 노트는 그 둘을 잇는 방법론(관찰, 언어화)을 줬습니다.",
  suggestions: [
    "<strong>창업 탐색은 '위화감 수집'부터</strong> — 시장 조사 대신, 일상에서 느끼는 어색함과 불편을 기록하는 것이 세발서점·아레나·덴츠가 공통으로 증명한 출발점입니다.",
    "<strong>크게보다 오래를 기준으로</strong> — 점수가 높았던 비즈니스는 모두 '2.5만 명의 50%', '월 12회 영업'처럼 작지만 깊은 구조였습니다. 아이디어를 평가할 때 규모 대신 지속 연수를 물어보세요.",
    "<strong>지금 직장을 수업료 없는 학교로</strong> — 박영아(상권 분석), 권효민(공간 운영), 윤성중(8곳의 기술) 모두 본업이 창업의 자산이 됐습니다. 지금 배우는 것의 목록을 만들어두세요."
  ],
  reflections: [
    "나는 최근에 어떤 위화감을 그냥 흘려보냈는가? 그것을 언어화하면 무엇이 되는가?",
    "내 커리어는 지금 낙타(견디며 힘 기르기) · 사자(규칙 거부) · 아이(내 가치 창조) 중 어느 단계인가?",
    "'영원히 반복되어도 좋을 순간'이 내 하루에 있는가 — 없다면 무엇을 바꿔야 하는가?"
  ],
  actions: [
    "이번 주 위화감 3개를 메모장에 수집하고, 하나를 '위화감→상식→의심→가설' 4단계로 분해하기",
    "미루던 습관 하나를 if/when-then 형식으로 다시 쓰고 실행하기 (예: 아침 커피를 내리면 → 10분 책 읽기)",
    "잠들기 전 '오늘 행복했던 순간 3가지' 기록 — 일주일 연속 실험",
    "지금 일에서 배우고 있는 '이전 가능한 기술' 목록 만들기 (박영아의 상권 분석에 해당하는 것)",
    "이번 주 암송 구절을 하루 한 번 소리 내어 읽기"
  ],
  verse: {
    text: "너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라",
    ref: "로마서 12:2 (개역개정)",
    why: "알고리즘(아레나)과 척하기(로로)와 세상의 상식(덴츠)을 따르지 않고 자기 기준을 분별하라는 이번 주 노트들의 메시지와 맞닿은 말씀입니다."
  }
};

/* ── 노트 데이터: 새 노트는 이 배열 맨 앞에 추가 ───────────── */
const NOTES = [
  {
    id: 2060,
    date: "2026-07-24",
    title: "폭염대책전 : 지옥 같은 여름에 맞설 '인류의 신사업', 도쿄에서 만났습니다",
    subject: "도쿄 제12회 폭염대책전 현장 리포트 · 참가 기업 189곳 (금동우 한화생명 동경주재사무소장 동행)",

function weekStartOf(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() - d.getDay()); // 일요일 시작
  return d;
}
function fmtMD(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }

function noteCard(n, filter) {
  const miniScores = Object.keys(PERSPECTIVES).map(k => `
    <span class="nc-s"><span class="dot" style="background:${PERSPECTIVES[k].color};width:7px;height:7px;border-radius:50%;display:inline-block;"></span>${n.scores[k].toFixed(1)}</span>`).join("");
  return `
    <details class="ncard">
      <summary>
        <div class="nc-meta"><span>${n.date}</span><span>#${n.id}</span><span class="nc-scores">${miniScores}</span></div>
        <div class="nc-title">${n.title}</div>
        <div class="nc-sum">${n.summary}</div>
        <div class="nc-open-hint">탭해서 전체 보기 ▾</div>
      </summary>
      <div class="ncard-body">
        <div class="subject">${n.subject}</div>
        <div class="summary">${n.summary}</div>
        <div class="scores">
          ${Object.keys(PERSPECTIVES).map(k => `
            <div class="score">
              <div class="sname"><span class="dot" style="background:${PERSPECTIVES[k].color};width:7px;height:7px;border-radius:50%;display:inline-block;"></span>${PERSPECTIVES[k].name}</div>
              <div class="sval">${n.scores[k].toFixed(1)}</div>
              <div class="strack"><div class="sfill" style="width:${n.scores[k]/5*100}%;background:${PERSPECTIVES[k].color}"></div></div>
            </div>`).join("")}
        </div>
        <details open>
          <summary>노트 요약</summary>
          <div class="body full-summary">${(n.fullSummary || []).map(p => `<p>${p}</p>`).join("")}</div>
        </details>
        ${Object.keys(PERSPECTIVES).map(k => `
          <details ${filter === k ? "open" : ""}>
            <summary><span class="dot" style="background:${PERSPECTIVES[k].color};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>${PERSPECTIVES[k].name} 인사이트</summary>
            <div class="body"><ul>${n.insights[k].map(i => `<li>${i}</li>`).join("")}</ul></div>
          </details>`).join("")}
        <details>
          <summary>인용문</summary>
          <div class="body">${n.quotes.map(q => `<blockquote>"${q}"</blockquote>`).join("")}</div>
        </details>
        <details>
          <summary>나에게 적용해볼 것</summary>
          <div class="body"><ul>${n.actions.map(a => `<li>${a}</li>`).join("")}</ul></div>
        </details>
        <div class="tags">${n.tags.map(t => `<span class="tag">#${t}</span>`).join("")}</div>
        <div style="margin-top:10px;"><a class="link" href="${n.url}" target="_blank">원문 보기 →</a></div>
      </div>
    </details>`;
}

function render(filter = "all") {
  const cards = document.getElementById("cards");
  const shown = (filter === "all" ? NOTES : NOTES.filter(n => n.scores[filter] >= 4.0))
    .slice().sort((a, b) => b.date.localeCompare(a.date));
  document.getElementById("empty").style.display = shown.length ? "none" : "block";

  // 주간(일요일 시작) 그룹핑
  const groups = new Map();
  shown.forEach(n => {
    const ws = weekStartOf(n.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, notes: [] });
    groups.get(key).notes.push(n);
  });

  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const sorted = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));

  cards.innerHTML = sorted.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""}>
        <summary>${fmtMD(g.start)} – ${fmtMD(end)} <span class="wk-count">노트 ${g.notes.length}개</span>${isNow ? '<span class="wk-now">이번 주</span>' : ""}</summary>
        ${g.notes.map(n => noteCard(n, filter)).join("")}
      </details>`;
  }).join("");
}

function renderBrief() {
  const b = WEEKLY_BRIEF;
  document.getElementById("weekly-brief").innerHTML = `
    <div class="b-kicker">주간 브리핑 · 고정</div>
    <h2>이번 주 요약과 제언</h2>
    <div class="b-period">${b.period}</div>
    <p>${b.summary}</p>
    <h3>제언</h3>
    <ul>${b.suggestions.map(s => `<li>${s}</li>`).join("")}</ul>
    <h3>성찰 질문</h3>
    <ul>${b.reflections.map(r => `<li>${r}</li>`).join("")}</ul>
    <h3>이번 주 행동 리스트</h3>
    <ul class="todo">${b.actions.map(a => `<li><input type="checkbox"><span>${a}</span></li>`).join("")}</ul>
    <div class="verse">
      <div class="v-label">이번 주 암송 구절</div>
      <div class="v-text">"${b.verse.text}"</div>
      <div class="v-ref">— ${b.verse.ref}</div>
      <p style="margin-top:8px; font-size:0.78rem;">${b.verse.why}</p>
    </div>`;
}

function renderStats() {
  document.getElementById("t-count").textContent = NOTES.length;
  const dates = NOTES.map(n => n.date).sort();
  document.getElementById("t-range").textContent = dates.length > 1 ? `${dates[0]} ~ ${dates[dates.length-1]}` : dates[0];
  const keys = Object.keys(PERSPECTIVES);
  const avgs = {};
  keys.forEach(k => { avgs[k] = NOTES.reduce((s, n) => s + n.scores[k], 0) / NOTES.length; });
  const overall = keys.reduce((s, k) => s + avgs[k], 0) / keys.length;
  document.getElementById("t-avg").textContent = overall.toFixed(1);
  const top = keys.sort((a, b) => avgs[b] - avgs[a])[0];
  document.getElementById("t-top").textContent = PERSPECTIVES[top].name;
  document.getElementById("t-top-sub").textContent = `평균 ${avgs[top].toFixed(1)}점`;
  document.getElementById("agg-bars").innerHTML = Object.keys(PERSPECTIVES).map(k => `
    <div class="bar-row">
      <div class="name">${PERSPECTIVES[k].name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${avgs[k]/5*100}%;background:${PERSPECTIVES[k].color}"></div></div>
      <div class="bar-val">${avgs[k].toFixed(1)}</div>
    </div>`).join("");
}

document.getElementById("perspective-filters").addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll("#perspective-filters .chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  render(btn.dataset.p);
});

function toggleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme");
  const isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", isDark ? "light" : "dark");
}

function newsIssues(text, max = 3) {
  const KEYWORDS = ["유가","관세","AI","폭염","폭우","여행","항공","호텔","리조트","물가","소비","금리","환율","부동산","실적","화재","수출","플랫폼","SNS","창업","청년"];
  const items = text.split("■").slice(1).map(s => {
    const first = s.split("\n")[0].trim();
    const sent = first.split(". ")[0];
    return sent.length > 60 ? sent.slice(0, 58) + "…" : sent;
  });
  const scored = items.map((t, i) => ({ t, i, score: KEYWORDS.reduce((s, k) => s + (t.includes(k) ? 1 : 0), 0) }));
  const picked = [...scored].sort((a, b) => b.score - a.score || a.i - b.i).slice(0, max).sort((a, b) => a.i - b.i);
  return picked.map(p => p.t);
}

function renderNews() {
  const el = document.getElementById("news-cards");
  const sorted = NEWS.slice().sort((a, b) => b.date.localeCompare(a.date));
  const groups = new Map();
  sorted.forEach(n => {
    const ws = weekStartOf(n.date);
    const key = ws.toISOString().slice(0, 10);
    if (!groups.has(key)) groups.set(key, { start: ws, days: [] });
    groups.get(key).days.push(n);
  });
  const todayKey = weekStartOf(new Date().toISOString().slice(0, 10)).toISOString().slice(0, 10);
  const weeks = [...groups.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  el.innerHTML = weeks.map(([key, g], i) => {
    const end = new Date(g.start); end.setDate(end.getDate() + 6);
    const isNow = key === todayKey;
    return `
      <details class="week" ${i === 0 ? "open" : ""}>
        <summary>${fmtMD(g.start)} – ${fmtMD(end)} <span class="wk-count">뉴스 ${g.days.length}일치</span>${isNow ? '<span class="wk-now" style="background: var(--series-6);">이번 주</span>' : ""}</summary>
        ${g.days.map(n => `
          <details class="ncard">
            <summary>
              <div class="nc-meta"><span>${n.date}</span><span>간추린 아침뉴스</span></div>
              <div class="issue-chips">${newsIssues(n.text).map(t => `<div class="issue-chip"><span>${t}</span></div>`).join("")}</div>
              <div class="nc-open-hint">탭해서 전체 뉴스 보기 ▾</div>
            </summary>
            <div class="ncard-body"><div class="news-full">${n.text.replace(/^📮[^\n]*\n?/, "").trim()}</div></div>
          </details>`).join("")}
      </details>`;
  }).join("");
}
